
<html>
    <head>
        <title>Basics of HTML demo</title>
    </head>
    <body>
    <div id="value"></div>

    <script>
        function generador (min,max){
            return Math.floor(Math.random() * (max-min + 1) + min);
        }
        

        const ran = 1373;
        const v = true;

        while (v){
            let n = generador(10000,99999999);
            if (n % ran == 0) {
                document.getElementById("value").innerText = "Random value is ${n}";
                   }
            }
        }
        

        
    </script>
    </body>
</html>
